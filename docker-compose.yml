services:
  easy-proxies:
    build:
      context: .
      dockerfile: Dockerfile
    image: mumujie/easy_proxies:latest
    container_name: easy-proxies
    restart: unless-stopped
    # 方式一：使用主机网络模式（推荐，支持端口自动重分配）
    network_mode: host
    # 方式二：手动映射端口（注释掉 network_mode，启用下面的 ports）
    # ports:
    #   # 共享 Pool 入口（listener.enabled=true 时使用）
    #   - "2323:2323"
    #   # Web 监控面板
    #   - "9888:9888"
    #   # 每节点端口范围（multi_port.enabled=true 时使用，根据节点数量调整）
    #   - "24000-24200:24000-24200"
    #
    # 两类入口可独立启用，也可同时关闭：
    #   - listener.enabled=true: 共享 Pool 入口 2323
    #   - multi_port.enabled=true: 每个节点独立端口 24000+
    #   - 两者同时启用时节点状态共享，端口冲突会自动重分配
    volumes:
      # 配置文件需要可写权限以支持 WebUI 设置保存
      # 如遇权限问题，请在宿主机执行: chmod 666 config.yaml nodes.txt
      - ./config.yaml:/etc/easy-proxies/config.yaml
      - ./nodes.txt:/etc/easy-proxies/nodes.txt
      # data 目录（存储 SQLite 数据库、节点数据、运行时统计、会话等）
      - ./data:/etc/easy-proxies/data
