# ═══════════════════════════════════════════════════════════════
# Easy Proxies 完整配置文件
# ═══════════════════════════════════════════════════════════════

# 日志级别: debug, info, warn, error
log_level: info

# 全局跳过 SSL 证书验证（默认 false，不建议在生产环境启用）
skip_cert_verify: false

# 外部 IP 地址，用于导出配置时替换 0.0.0.0（可选）
# external_ip: "your.public.ip"

# SQLite 数据库文件路径（默认 data/data.db，相对于配置文件目录）
# 用于存储节点数据、运行时统计、会话等
# database_path: "data/data.db"

# ───────────────────────────────────────────────────────────────
# 共享 Pool 入口配置
# ───────────────────────────────────────────────────────────────
listener:
  enabled: false        # 是否创建共享 Pool 入口；默认关闭
  address: 0.0.0.0      # 监听地址
  port: 2323            # 监听端口
  protocol: http        # 监听协议: http | socks5 | mixed
  username: username    # 代理认证用户名
  password: password    # 代理认证密码

# ───────────────────────────────────────────────────────────────
# 代理池配置
# ───────────────────────────────────────────────────────────────
pool:
  # 调度模式: sequential（顺序轮询）, random（随机选择）, balance（最小连接数负载均衡）
  mode: sequential
  # 连续失败多少次后加入黑名单
  failure_threshold: 3
  # 黑名单持续时间
  blacklist_duration: 24h

# ───────────────────────────────────────────────────────────────
# 每节点多端口入口配置
# ───────────────────────────────────────────────────────────────
multi_port:
  enabled: false        # 是否为每个节点创建独立入口；节点较多时建议关闭
  address: 0.0.0.0      # 监听地址
  base_port: 24000      # 起始端口号
  protocol: http        # 监听协议: http | socks5 | mixed
  username: mpuser      # 默认认证用户名
  password: mppass      # 默认认证密码

# ───────────────────────────────────────────────────────────────
# 管理面板配置
# ───────────────────────────────────────────────────────────────
management:
  enabled: true                                      # 是否启用管理面板
  listen: 0.0.0.0:9888                               # 监听地址
  probe_target: https://cp.cloudflare.com/generate_204 # 必须返回 204；HTTPS 会执行 TLS/SNI/证书校验
  health_check_interval: 2h                          # 周期健康检查间隔（默认 2 小时）
  probe_concurrency: 0                               # 0=按节点数自动计算；也可固定为 1-512
  startup_probe_timeout: 5s                         # 启动/重载时每个节点的总探测预算
  routine_probe_timeout: 10s                        # 周期/手动探测总预算（包含失败重试）
  probe_dial_timeout: 3s                            # 代理拨号阶段上限
  probe_response_timeout: 2s                        # TLS、HTTP 写入及响应头读取上限
  routine_probe_retries: 1                          # 周期/手动失败重试次数（0-2）
  password: "123456"                                       # WebUI 访问密码，为空则不需要密码
  # 手动综合检测；仅从 WebUI 触发，不影响节点健康、黑名单或分组调度
  node_check:
    latency_url: https://cp.cloudflare.com/generate_204
    speed_url: https://speed.cloudflare.com/__down?bytes=100000000
    landing_ip_url: https://api.ipify.org            # 通过节点隧道请求；成功后按节点身份缓存，重启不重复检测，不使用节点 host
    latency_timeout: 5s
    speed_duration: 5s                              # 达到持续时间或最大字节任一条件即停止
    speed_request_timeout: 8s
    quality_timeout: 5s
    max_download_bytes: 100000000
    peak_sample_interval: 100ms
    latency_concurrency: 20                         # 1-128
    speed_concurrency: 2                            # 1-8，避免批量任务占满带宽
    quality_concurrency: 5                          # 1-10
    include_handshake: false                        # false=预热后测第二次请求
    ippure_enabled: false                           # 外部质量源默认关闭，启用时必须配置 URL
    ippure_url: ""
    ip_api_enabled: false                           # 免费接口为 HTTP 且仅限非商业用途
    ip_api_base_url: http://ip-api.com/batch

# ───────────────────────────────────────────────────────────────
# GeoIP 地域分区配置（可选）
# ───────────────────────────────────────────────────────────────
# 启用后，节点会按地域自动分组，可通过路径访问特定地域的代理池：
#   http://127.0.0.1:2323/jp    - 日本节点
#   http://127.0.0.1:2323/kr    - 韩国节点
#   http://127.0.0.1:2323/us    - 美国节点
#   http://127.0.0.1:2323/hk    - 香港节点
#   http://127.0.0.1:2323/tw    - 台湾节点
#   http://127.0.0.1:2323/sg    - 新加坡节点
#   http://127.0.0.1:2323/other - 其他地域
#   http://127.0.0.1:2323/      - 全部节点（默认）
geoip:
  enabled: false                                     # 是否启用 GeoIP 地域分区
  database_path: "./GeoLite2-Country.mmdb"           # GeoIP 数据库路径（首次启动时自动下载）
  auto_update_enabled: true                          # 是否启用自动更新数据库（推荐）
  auto_update_interval: 24h                          # 自动更新间隔（默认 24 小时）
  # listen: 0.0.0.0                                  # GeoIP 路由监听地址（默认使用 listener 配置）
  # port: 2323                                       # GeoIP 路由监听端口（默认 2323）
  # 注意：
  #   - 首次启动会自动从 GitHub 下载 GeoIP 数据库（约 9MB）
  #   - 启用 auto_update_enabled 后，数据库会定期自动更新，无需重启容器
  #   - 更新过程采用热重载，不会中断现有连接

# ───────────────────────────────────────────────────────────────
# 订阅自动刷新配置（可选）
# ───────────────────────────────────────────────────────────────
# subscription_refresh:
#   enabled: false              # 是否启用定时刷新
#   interval: 1h                # 刷新间隔（默认 1 小时）
#   timeout: 30s                # 获取订阅的超时时间
#   health_check_timeout: 60s   # 新节点健康检查超时
#   drain_timeout: 30s          # 旧实例排空超时时间
#   min_available_nodes: 1      # 最少可用节点数，低于此值不切换

# ═══════════════════════════════════════════════════════════════
# 节点配置方式（三选一或混合使用）
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 方式 1: 订阅链接（推荐，自动获取并写入 nodes.txt）
# ───────────────────────────────────────────────────────────────
subscriptions:
  - "https://example.com/subscribe?token=xxx"
#   - "https://another.com/api/v1/client/subscribe?token=yyy"

# ───────────────────────────────────────────────────────────────
# 方式 2: 节点文件（每行一个代理 URI）
# ───────────────────────────────────────────────────────────────
# nodes_file: nodes.txt

# ───────────────────────────────────────────────────────────────
# 方式 3: 直接在配置文件中配置节点
# ───────────────────────────────────────────────────────────────
# nodes:
  # 最简配置：只需 URI，名称从 # 后自动提取
  # - uri: "vless://uuid@server:443?security=tls&type=ws&path=/path#节点名称"

  # 完整配置：手动指定名称和端口
  # - name: "自定义名称"
  #   uri: "ss://base64@server:8388"
  #   port: 24001              # 手动指定端口（multi_port.enabled=true 时使用）
  #   username: "custom_user"  # 覆盖默认认证（可选）
  #   password: "custom_pass"

# ───────────────────────────────────────────────────────────────
# 支持的代理协议
# ───────────────────────────────────────────────────────────────
# - VMess:    vmess://base64_encoded_json
# - VLESS:    vless://uuid@server:port?params#name
# - Trojan:   trojan://password@server:port?params#name
# - SS:       ss://method:password@server:port#name
#             ss://base64(method:password)@server:port#name
# - SSR:      ssr://base64_encoded
# - Hysteria2: hy2://password@server:port?params#name
# - HTTP:     http://user:pass@server:port
# - SOCKS5:   socks5://user:pass@server:port
